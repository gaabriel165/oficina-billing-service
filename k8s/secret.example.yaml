apiVersion: v1
kind: Secret
metadata:
  name: oficina-billing-service-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgres://user:password@host:5432/oficina_billing?sslmode=require"
  JWT_SECRET: "your_secret_key_here"
  PUBLIC_BASE_URL: "https://your-api-gateway-url"
  MERCADOPAGO_ACCESS_TOKEN: "your_mercadopago_access_token_here"
  MERCADOPAGO_WEBHOOK_SECRET: "your_mercadopago_webhook_secret_here"
  RESEND_API_KEY: "your_resend_api_key_here"
  OTEL_EXPORTER_OTLP_HEADERS: "api-key=your_new_relic_license_key_here"
