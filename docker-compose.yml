services:
  api:
    build: .
    ports:
      - "${HOST_PORT:-8081}:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      elasticmq:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oficina_billing
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./local/elasticmq.conf:/opt/elasticmq.conf:ro

volumes:
  postgres_data:
